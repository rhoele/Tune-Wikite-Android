android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 不在项目里写死 org.gradle.java.home：Windows 绝对路径会让 Linux/macOS 上的 CI 直接失败。
# 本机请用 JAVA_HOME（或用户级 ~/.gradle/gradle.properties）指定 JDK 17。

# FCM 自有推送服务基地址（server/fcm）。
# 仅 debug 构建默认使用本机 127.0.0.1:8787（配合 adb reverse tcp:8787 tcp:8787），
# release 构建只接受显式注入的 https:// 地址，且不会把本机明文地址打进发布包：
#   .\gradlew.bat assembleRelease -PFCM_SERVER_BASE_URL=https://your-host
